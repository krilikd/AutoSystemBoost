# CONFIG_SHAPE=dc8d226adff8
# Fingerprint of every option list and slider range in the WebUI. asb_lint.sh compares
# against it: if the shape moves and this does not, a stored value may now mean something
# different from what the user chose, and the schema number in install.sh needs bumping
# with a migration to match. Three regressions came from exactly that going unnoticed.
heavy_gpu_enter=35
heavy_load_enter=20.0
gaming_gpu_enter=55
gaming_confirm_ticks=6
sustained_gpu_min=45
sustained_load_min=4.0
# Throttling point mode: stock|smart|manual stock - this device's own trip point, read from the
# CPU thermal zone at boot and stored in /data/adb/asb/thermal_stock.
sustained_temp_mode=smart

# Ceiling for self-tuning, written by the shell from the mode above. Equal to the value
# for stock/manual (self-tuning off), higher for smart.
sustained_temp_ceiling=68

# 1 = the slider above outranks the per-profile presets (perf_/balanced_sustained_temp_*).
# Without this the slider was read on the Battery profile alone and silently ignored on
# Performance, Balanced and Smart.
sustained_temp_user_override=0

sustained_temp_enter=65

# Performance ceiling, as a percentage of the profile's own limits: 60..100
#   100 = profile values unchanged (default). Lower trims every uclamp ceiling
#   proportionally - background, foreground and top-app - so the phone reaches for less
#   speed under the same load and runs cooler for it.
#   Scaled rather than fixed per model: the profile's numbers are already matched to this
#   device, and a second per-model table would only disagree with them.
#   Floors are never touched: they are what keep touch response and audio smooth.
perf_ceiling_pct=100
sustained_temp_exit=52
heavy_gpu_exit=25
gaming_gpu_exit=45
sustained_gpu_exit=35
# SUSTAINED sits BELOW heavy (0.72) on the cap ladder, not above it.
# Measured over a full day: SUSTAINED drew 739 mA at 63 C against HEAVY's 331 mA at 44 C on the
# same load - more than GAMING - and held 24% of screen-on time while the vendor thermal HAL
# never clamped once.
sustained_level=0.62
heavy_min_dwell_s=8
sustained_min_dwell_s=24
gaming_min_dwell_s=25
reassert_heavy_s=12
reassert_gaming_s=6
msm_perf_boost_only=1
thermal_overlay_pct=18
thermal_throttle_temp=60
# --- Skin-anchored thermal decision (V59.1) ------------------------------------ The cpu_max
# (junction) sensor sits at 85-95C under ANY real load, so throttling/ vetoing on it alone
# false-fires during normal bursts and defeats race-to-idle (worse heat AND drain).
thermal_skin_gate=1
thermal_skin_c=47
thermal_junction_hard_c=95
# Adaptive thermal budget uses available thermal headroom before hard throttle.
# It only lowers ceilings on a sustained headroom deficit; Thermal HAL remains
# authoritative and the dwell prevents cap oscillation around a threshold.
thermal_budget_enable=1
thermal_budget_light_headroom_pct=70
thermal_budget_moderate_headroom_pct=45
thermal_budget_severe_headroom_pct=25
thermal_budget_light_trim_pct=8
thermal_budget_moderate_trim_pct=18
thermal_budget_severe_trim_pct=32
thermal_budget_dwell_s=30
# Shadow mode computes and records governor decisions without writing sysfs or
# cgroup nodes. Enable it first on a new device before policy canary testing.
shadow_mode=0
# --- Gaming CPU ceiling --------------------------------------------------------- During the
# GAMING state the smart curve can request up to ~3 GHz, but the vendor PowerHAL clamps the
# real clock to ~2.2 GHz anyway — the extra request buys no FPS and only causes brief
# high-voltage OPP excursions (more heat + drain).
# This caps the DECLARED scaling_max in gaming so ASB never asks higher than the vendor holds.
gaming_cpu_max_ceiling_khz=2400000

# Camera hold: keep interactive caps while the camera pipeline streams.
# Reported from the field as jerky 4K60 capture and playback that cleared the instant the CPU,
# memory and scheduler tweaks were removed.
camera_hold_enable=1

# What counts as "the camera is streaming": CPU% of one core burned by the
#   camera HAL provider process. 15 catches preview and recording while
#   ignoring an idle provider. Raise it if the hold engages when it should not.
camera_busy_pct=15

# How long the hold stays after the pipeline goes quiet, in seconds. This
#   covers the gap between stopping a recording and the file being finalised,
#   and stops the caps oscillating between shots.
camera_hold_grace_s=20

# Longest a camera stream may FORCE the heavy state, seconds. 0 = no limit.
#   A photo burst is seconds and 4K60 recording is minutes, which is what the hold was for.
#   A video call streams the camera identically for tens of minutes, and with no limit the
#   phone held interactive caps, full polling and the anti-clamp for the whole call - the
#   OnePlus 13 "hot on video calls" report. Past this the normal state machine and the
#   thermal path take over; genuine load still raises the state on its own.
#   The hold is also released early if the CPU reaches the profile's throttle point.
camera_hold_max_s=180
gaming_gap_thresh=1650000
gaming_gap_ticks=5
auto_degrade_thermal_pct=45
gaming_retry_cooldown_s=18
gaming_retry_temp_max=50
sustained_reentry_cooldown_s=24
highload_mode=stable
moderate_load_enter=14.0
# Log detail: stock|0|1|2|3
#   stock  ASB does not touch device logging at all
#   0      extreme - device logging and debug cut as far as they go (reversible)
#   1      normal (this is what used to be 0)
#   2      detailed - learner updates and screen transitions
#   3      verbose
# Resolved by the shell into log_verbosity below, which is what the governor reads.
# Deep sleep (Doze) entry timing: stock|moderate|aggressive
#   stock       delete the key, Android's own 30-minute wait applies
#   moderate    idle after 5 minutes of screen-off
#   aggressive  idle after 2 minutes, shorter sensing and locating windows
# Only touches when idle STARTS, never the maintenance windows or quotas - shrinking those
# is how battery saving turns into alarms that stop firing.
doze_level=stock

# Trim the Doze exemption list: 0 = leave it, 1 = remove user apps from it
#   Constants decide how soon Doze starts; this list decides who ignores it. An app that
#   added itself keeps waking the phone through every idle window, which is why tuning
#   only the timings can look like it did nothing.
#   Only user-installed packages are touched - never the dialer, SMS, clock or root
#   manager. Removed entries are recorded and restored when this goes back to 0 or the
#   module is uninstalled. Applies with doze_level=aggressive or night.
doze_trim_whitelist=0

# Act on apps that hold the phone awake at night: 0 = only report, 1 = restrict them
#   Measuring is always on and costs nothing. With 1, a user-installed app still holding a
#   partial wakelock after 45+ minutes of screen-off, on a phone that is staying awake, is
#   moved to Android's "restricted" standby bucket.
#   Never touched: kernel and system sources (modem, display, alarm timer, sensors), and
#   authenticators, dialer, SMS, messaging and clock apps.
#   Restricted is a state Android manages and can undo; nothing is force-stopped.
wakelock_action=0

# Limit GPS for apps the user has already left: 0 = off, 1 = on
#   Android reports location held by CACHED processes - apps that are closed and doing
#   nothing the user asked for. A field capture showed 53 of 56 mAh of GPS drain in that
#   state, from an app that had been shut minutes earlier.
#   Only user-installed apps, only while the screen is off, only while the process is
#   cached. Navigation, fitness and safety apps are never touched, and any app gets full
#   location back the moment it is opened.
gnss_trim=0

log_level=1

# Background process limit: stock | relaxed | strict
#   Android kills "phantom" processes - child processes an app spawns outside the normal
#   lifecycle - once there are more than 32. It is why some terminal sessions, emulators
#   and compilers die mid-run on Android 12+.
#   relaxed turns the monitor off entirely, which is what ASB has always done silently.
#   strict restores Android's own behaviour. stock leaves whatever is already set.
#   No reboot; takes effect for newly spawned processes.
phantom_procs=relaxed

# OxygenOS's own background app killer: stock|off
#   AthenaService is the component in com.oplus.athena that decides which background apps
#   get killed. Disabling it is why messengers stop delivering notifications from the
#   background, and no battery whitelist fixes that because it is not Android's Doze.
#   "off" disables the COMPONENT only - the package keeps running, so thermal reporting and
#   the settings panels are unaffected. Reversible; the previous state is recorded first.
#   Costs RAM and a little drain: keeping apps alive is not free.
athena_service=stock

log_verbosity=0
bat_heavy_load_enter=20.0
bat_moderate_load_enter=14.0
bat_suppress_gaming=1
bat_fast_idle_s=12
bat_light_idle_gpu=10
env_iq_quiet=28
env_iq_hostile=10
env_wph_noisy=5
env_wph_hostile=12
quiet_entry_ticks=36
quiet_fast_ticks=24
# Quiet Night activates only after verified battery-like deep idle; the display/socket
# event path remains immediate while the native sampler backs off to one minute.
quiet_tick_s=60
quiet_exit_grace=3
bat_comfort_temp=48
clamp_economy_after_s=35
clamp_thermal_every_n=3
virtual_ceiling_alpha=7
action_waste_threshold=3
balanced_heavy_load_enter=20.0
balanced_moderate_load_enter=14.0
balanced_warmup_grace_s=50
balanced_warmup_bypass_temp=59
balanced_warmup_bypass_headroom=45
thermal_stale_after_s=60
soft_clamp_headroom_pct=72
hard_clamp_headroom_pct=48
# Performance thermal band.
#
# The exit was 45 against an enter of 48 - a 3 degree window, which is narrower than the swing
# a single frequency ramp produces.
# The result is oscillation: lean in at 48, cool to 45, release, heat straight back to 48.
#
# Widening the exit to 42 costs nothing in sustained throughput - the lean level is
# unchanged, it simply stops being released prematurely - and each avoided ramp is heat
# not generated. This is the one thermal lever here that does not trade away performance.
perf_sustained_temp_enter=48
perf_sustained_temp_exit=42
perf_sustained_level=0.62
perf_hot_guard_temp=58
perf_hot_guard_ticks=2
perf_skin_hot_thresh=80
balanced_sustained_temp_enter=54
balanced_sustained_temp_exit=48
auto_battery_enable=1
# Auto Battery profile thresholds.
# low = switch INTO Battery at this level or below (the test is <=, so 20 means "at 20%") high
# = return to the previous profile at this level or above The gap is deliberately one percent:
# switch at 20, come back at 21, symmetric around the setting.
auto_battery_low_pct=20
auto_battery_high_pct=21
auto_battery_min_gap_s=300
night_quiet_enable=1
night_quiet_hour_start=23
night_quiet_hour_end=6
BG_TRIM_LEVEL=safe

# Google Play services background trim: stock | lite | strict
#   NOT a package freezer - GMS is never disabled, so push, sign-in, payments and the
#   Play Store keep working.
#   lite   = stop location reporting and the search widget's background work. No effect
#            on notification delivery.
#   strict = also remove GMS from the Doze whitelist. Saves the most on a GMS-heavy
#            device and CAN delay notifications by minutes while the phone is asleep.
#   Reversible: appops are recorded in baseline.txt and restored on uninstall.
gms_trim=stock

# Freeze individual Google Play services components: off | safe | more
#   NOT package freezing - com.google.android.gms stays enabled, so push, sign-in,
#   payments and the Play Store keep working.
#   safe = telemetry, usage reporting, checkin, analytics. Nothing user-facing depends
#          on these; the phone does not notice they are gone.
#   more = adds ads personalisation and location history uploads. Ads still appear, they
#          are just less targeted; Maps works, Timeline stops recording.
#   Never touched at any level: push delivery, module loading, account sign-in, payments.
#   Every component's prior state is recorded and restored when this goes back to off or
#   the module is uninstalled.
gms_freeze=off
UX_ANIM_FORCE_RESTART=0

# Animation speed: profile | off | fastest | faster | fast | stock | slow | slower
#   profile keeps the old behaviour - the active power profile picks the scale.
#   Anything else overrides it, so the UI speed stops being a side effect of a power
#   setting. Smaller values are faster; off disables animations entirely.
#   No reboot: WindowManager reads the scale per animation.
anim_speed=-1
UX_MANAGE_TIMEOUTS=0
UX_MANAGE_OEM_TOGGLES=0

# Disable blur: 0 | 1 Turns window blur off everywhere.
disable_blur=0

# OxygenOS visual-effects level: stock | flat stock leaves it alone.
# It used to be bundled into disable_blur, so someone who wanted a sharp notification shade
# lost their Recents cards with no way back short of re-enabling blur.

ui_effects_level=auto

# Vibration strength: 0-10, or "stock" OnePlus keeps the real control on its own scale.
# Going above a tested value on a linear actuator is wear for no promise, so that is the top.
#
# TCP congestion control: auto|bbr|cubic BBR paces to measured bandwidth; on mobile links that
# beats Cubic, which treats radio interference as congestion and backs off for no reason.
# Unavailable algorithms are reported rather than silently ignored.
net_congestion=auto

# Per-link overrides: auto|bbr|cubic / auto|fq|fq_codel|cake auto = follow the global setting
# above.
# Anything else pins that value for that link type only, so WiFi and mobile can differ - BBR
# earns its keep on a mobile link where loss means interference, while a good router on WiFi is
# often happier with Cubic.
#
# The congestion algorithm is applied PER ROUTE (`ip route change ...
# The common approach instead rewrites the single global sysctl whenever the active interface
# changes, which means only one can be right at a time and needs a polling loop to notice the
# switch.
net_congestion_wifi=auto
net_congestion_mobile=auto
net_qdisc_wifi=auto
net_qdisc_mobile=auto

# Queue discipline: auto|fq|fq_codel|cake fq_codel keeps latency low under load, fq pairs with
# BBR, cake is thorough but heavy.
net_qdisc=auto

# WiFi regulatory domain: auto|CR|US|DE|JP|...
wifi_country=auto

# Initial TCP windows per route: auto|off|conservative|aggressive How many segments may go out,
# and be advertised, before the first ACK.
net_route_tune=auto

# Spread received network packets across cores: stock|little|all
#   RPS/RFS. Stock keeps every packet on the core the interrupt landed on, which caps
#   throughput on fast WiFi. Costs CPU to wake a second core, so it wins on a fast link
#   and loses on a slow one. Off by default.
net_rps=stock

# Transmit queue depth: stock|short|shorter (1000 / 256 / 128)
#   The stock 1000 is a wired-Ethernet default from the 1990s. On WiFi a deep queue adds
#   latency under load more than it adds throughput.
net_txqueue=stock

# WiFi scan throttle: auto|0|1
#   0 scans more often (roams sooner, costs battery), 1 is stock, auto leaves it alone.
wifi_scan_throttle=auto

# Cellular/radio policy master: 0|1. OFF means power profiles never write modem context or
# TCP keepalive settings; existing Android radio policy remains untouched. Turn on only if this
# device uses a SIM/eSIM and you explicitly want ASB's separate radio controls below.
radio_policy_enable=0
# Fast WiFi-to-mobile handover: 0|1. Requires the radio policy master above. When enabled, keep
# the cellular data context ready while the screen is on and modem LPM is normal/fast. It does
# not disconnect WiFi or alter OEM roaming thresholds; save/night LPM releases the modem.
net_handover_fast=0
# Explicit, screen-on only escape from a framework-unvalidated Wi-Fi default route.
net_handover_active=0

# Leave Wi-Fi when the signal is this weak, in dBm: off, -85, -80, -75, -70, -65
#   Normally ASB only releases a Wi-Fi network that has stopped passing validation. That
#   misses the walking-away case: a router at the edge of range still answers, so the
#   network stays technically valid while nothing loads.
#   With a threshold set, a signal below it releases the route on its own - after the same
#   confirmation passes, so a momentary dip behind a wall does not trigger it.
#   -85 is where 802.11 has no usable rate left on any band. -80 and -75 leave sooner and
#   are more likely to drop a network that would still have worked.
#   -70 and -65 are for people who would rather switch early than stay on a fading link:
#   a user walking out of an office measured the connection holding to about 45 m and only
#   reattaching at around 15 m, and asked for thresholds that leave before that. They will
#   also drop networks that were still usable, which is the trade they are choosing.
#   off is the default: nobody gets a new disconnect reason without asking for it.
net_wifi_leave_rssi=off

# Let Android leave an unusable Wi-Fi network by itself: 0 = off, 1 = on
#   Sets network_avoid_bad_wifi, the platform's own switch for "when Wi-Fi stops passing
#   validation, move the default route to mobile". The system does the switching, keeps
#   the Wi-Fi radio associated, and moves back on its own when the link recovers.
#   This is what the Pixel quick-settings behaviour actually is, and it is the closest a
#   module can get: choosing the active network directly needs a system API that is not
#   reachable from a shell script.
#   Independent of net_handover_active - that one disables the radio outright, which is
#   heavier and visible to the user. Enabling this one and leaving that off is the calmer
#   combination.
net_avoid_bad_wifi=0

haptic_strength=-1

# Touch-feedback strength: 0-10, or "auto" (follow the alert level above).
# A separate axis because the OEM treats it as one - its own slider writes 1500 for
# notifications and 1600 for touch, independently.
haptic_touch_strength=-1

# Ceiling of the OEM stepless scale that level 10 maps to.
haptic_stepless_max=2400
# Audio processing profile: eq_compat|stock|hifi Which side does the SOFTWARE processing.
# Hands the signal to an external EQ/ViPER untouched - forcing max resampling underneath one is
# exactly what breaks it.
audio_profile=stock

# Hi-Fi DAC mixer tuning: 0|1 Headphone companders OFF and RX HPH Mode -> CLS_H_HIFI in the
# device's own mixer files.
audio_dac_hifi=0
CAMERA_LEVEL=0

# Film grain: 0-10, 3 = stock (exactly 100%); 10 is a visible 3.3x film look.
# addNoiseWeight* is grain the camera puts BACK after denoising, because a perfectly smooth
# image reads as plastic.
CAMERA_GRAIN=3

# Contrast and colour depth: 0-10, 3 = stock (exactly 100%); 10 reaches 170%.
CAMERA_CONTRAST=3

# Portrait AI: 0-6, 0 = off (stock); 6 reaches the safe blend-weight ceiling.
# (It used to overwrite unconditionally, so level 1 turned a stock 0.7 into 0.15.)
CAMERA_PORTRAIT=0

# Macro and low-light sharpening: 0-10, 0 = follow the main sharpening; 10 is 3.2x.
#   MacroParams and LivehouseParams have their own scales, and these are the modes where
#   over-sharpening shows worst: close subjects and high ISO both amplify halos.
CAMERA_LOWLIGHT=0
CAMERA_AGGRESSIVE=0
CAMERA_AGGRESSIVE_INJECT=safe
smart_mode_enabled=0
smart_conf_low=350
smart_conf_high=650
smart_eff_obs_full=2000
smart_pkg_plaintext=0
smart_night_start_hour=0
smart_night_end_hour=6
smart_interactive_max=150
smart_idle_bias_min=-200
smart_idle_bias_max=200
smart_sleep_bias_max=1000
smart_net_conservative_max=1000
# smart_battery_bias: extra battery-lean nudge for Smart (x1000, 0=off).
smart_battery_bias=0
smart_debug_log=0
night_quiet_auto=1

# Deep radio idling inside the learned sleep window: 0|1
#   Stretches TCP keepalive to six times the profile value and shortens the probe burst,
#   only between the hours the learner derived from your own nights. A night capture showed
#   the modem path waking the SoC about a thousand times - rmnet_ipa 180, rmnet_ctl 300,
#   IPA_LAN 318 - while the CPU itself slept 97% of the time.
#   Never touches airplane mode or radio power: calls still arrive, high-priority push
#   still lands. An app that polls its own server can be late until morning.
night_modem_idle=0
night_quiet_auto_min_samples=3
charge_aware_enable=1
cool_gaming=1

# Media loudness: stock|mild|strong|max Reshapes the audio-policy volume CURVES so every slider
# position is genuinely louder.
# The 0 dB point at 100% is never raised, so nothing clips - for real gain ABOVE unity use
# dsp_loudness below.
media_loudness=stock

# ASB DSP loudness: off|1..18 (dB of makeup gain, limiter always on) Ignored when
# audio_profile=eq_compat: that profile hands the stream to an external engine (ViPER and
# friends), and our effect on the same output stops that engine from seeing the stream at all,
# so the DSP is switched off there.
# This is the gain stage the volume curves cannot provide: media_loudness can make every slider
# position louder but can never exceed 0 dB at 100% (that is unity -- past it you only clip).
dsp_loudness=0
# DSP bass boost: off|1..10 (dB of low-shelf lift, needs dsp_loudness above) A shelf at 90 Hz:
# the full lift lands on the low end, half of it at the corner, and nothing above roughly 1 kHz
# - mids and vocals are untouched.
# It runs at the head of the chain, before the compressor and the limiter, so the added low end
# is under the same protection as everything else and cannot clip on its own.
dsp_bass=0
# DSP compressor: on | off On by default, and that is right for large gain: 6:1 above -24 dBFS
# holds the body of a track down so the peaks stay clean.
# Turning it off does NOT remove the true-peak limiter, so this cannot clip.
dsp_compressor=on

# Which outputs the DSP is allowed on: all | speaker | wired | bt | speaker+wired |
#                                      speaker+bt | wired+bt
#   The effect used to attach to every output at once, so someone who wanted a lift on
#   Bluetooth got the same lift on the loudspeaker whether they wanted it or not - and the
#   speaker is exactly where extra gain is least welcome, being the smallest driver.
#   Names are matched against the audio device the effect is attached to, so an output
#   this device does not have is simply never matched.
dsp_outputs=all

# EU headphone volume limiter: 0 = keep it, 1 = remove it
#   Android warns and caps headphone output above a level the EU considers unsafe for
#   sustained listening. ASB used to remove that cap silently as part of the KERNEL
#   category - a hearing-safety decision taken on the user's behalf, with no mention
#   anywhere. It is now off by default and asked for explicitly.
#   Removing it does not make anything louder on its own; it removes the ceiling that
#   stops the existing volume slider going further.
audio_remove_volume_limit=0

# Vendor log purge: 0 = leave them, 1 = clear on install
#   Deletes the contents of vendor crash/log directories (tombstones, ramdump, bsplog,
#   anr and friends). Irreversible, so it is opt-in rather than a side effect of the LOG
#   category. Dropbox keeps its five newest entries either way.
purge_vendor_logs=0

# Which audio-effect build to install: auto | aidl | aidl_v2 | aidl_v3 | legacy NOT a WebUI
# card.
# auto has been verified end to end on both interface versions and needs no user involvement,
# and a setting nobody can meaningfully choose - whose wrong value silently kills audio - does
# not belong in the interface.
#
# What auto decides.
# A OnePlus 13 running Android 16 declares effect v2 because its vendor is an Android 15
# vintage; a OnePlus 15 declares v3.
#
# legacy is for a device whose manifest declares a HIDL effect factory instead.
dsp_effect_abi=auto


# Bluetooth absolute volume: stock|disabled stock = absolute volume ON (default, recommended).
bt_absvol_mode=stock

# Bluetooth audio link stability: stock or stable
#   For phones where headphones disconnect mid-playback. This is not a common fault - most
#   devices never see it - so it is off by default and exists for the ones that do.
#
#   "stable" stops Wi-Fi scanning for new networks while BT audio is playing. The 2.4 GHz
#   band and Bluetooth share one antenna, and a scan sweeps the whole band: a stream that
#   misses its slot does not get quieter, it disconnects. This is the standard remedy for
#   that symptom, and the cost is that new networks appear in the list more slowly.
#
#   It does NOT force a codec. LDAC or aptX HD on a marginal link is a real cause of
#   dropouts, but which codec a headset negotiates is the headset's and the user's choice;
#   overriding it silently would change how their music sounds without asking.
bt_link_stability=stock

# Bluetooth A2DP hardware offload: on|off|auto on = keep A2DP offloaded to the DSP (stock, best
# battery/codec efficiency).
# BUT audio effect engines (ViPER4Android, JamesDSP, etc.) CANNOT process Bluetooth audio while
# it is offloaded — the stream bypasses the effect chain in the DSP.
bt_a2dp_offload=on

# Region: allow system locale as a last-resort source for Wi-Fi country code
# when no SIM/operator country is available. 0=off (safest), 1=allow locale.
region_allow_locale=0
charge_assist_alpha_max=450
charge_temp_warn_dC=390
charge_temp_hot_dC=415
# GPU idle-trim: in light non-video states (LIGHT_IDLE/MODERATE, not gaming, not
# thermal-capped) shave the GPU ceiling by this % to save the GPU rail, never dropping below
# the floor.
gpu_idle_trim_pct=12
gpu_idle_trim_floor=55
gpu_video_busy_min=40

# GPU ceiling (% of max) while video playback is detected. 0 = no ceiling.
#   Playback was the highest-drain phase in a field capture - 25.4 %/h against 14.2 %/h for
#   gaming on the same device, GPU at 55% and the CPU nearly idle. It was also the one
#   high-GPU case with no ceiling of its own: the idle trim is skipped during video (right,
#   it would cut a decoder mid-frame) and nothing replaced it.
#   The decode block does the work and the GPU only composites, so a ceiling above what
#   compositing needs still saves a ramp to maximum that nothing asked for.
#   Never applied in PERFORMANCE, never on top of a thermal cap. Raise it if you see
#   stutter on high-refresh 4K content.
gpu_video_max_pct=70

# Smart Media Guard (opt-in): only in the Smart profile, and only for a freshly
# identified foreground non-game app that remains game-like CPU+GPU heavy for a minute.
# It narrows the effective GPU ceiling to the existing 70% media envelope; it never
# changes CPU floors, power-network policy, audio playback or known-game behavior.
smart_media_guard=0

# --- Device-adaptive bounds (Phase 2) --- 0 = governor uses its compiled-in OP15 bounds
# (default, what ships).
device_bounds_override=1
